name: 🔁 Deploy cloud-mail sync worker to Cloudflare Workers

# Deploys sync-worker/ only. The main mail deploy workflow
# (deploy-cloudflare.yml) covers mail-worker/ and mail-vue/ and never
# touches this worker.
#
# Runs automatically on a push to main that changes sync-worker/.
# Manual run: Actions -> "Deploy cloud-mail sync worker" -> Run workflow.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (same ones the main
#   deploy uses), CLOUDMAIL_ADMIN_EMAIL, CLOUDMAIL_ADMIN_PASSWORD,
#   SYNC_TOKEN, SERVICE_TOKEN.
# Required repo variables (same page, Variables tab) — secrets work too:
#   CLOUDMAIL_URL, HOME_HEALTH_URL, HOME_INJECT_URL, USER_MAP.
# Optional: SYNC_KV_ID (id of an existing SYNC_KV namespace; if unset the
# workflow finds or creates one titled SYNC_KV).

on:
  # Deploys by itself whenever the sync worker's code changes on main,
  # like the main mail deploy does. Manual runs still work.
  push:
    branches: [ main ]
    paths:
      - "sync-worker/**"
  workflow_dispatch:

jobs:
  Deploy-sync-worker:
    name: 🏗️ Deploy sync worker
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SYNC_KV_ID: ${{ secrets.SYNC_KV_ID || vars.SYNC_KV_ID }}
      CLOUDMAIL_URL: ${{ secrets.CLOUDMAIL_URL || vars.CLOUDMAIL_URL }}
      HOME_HEALTH_URL: ${{ secrets.HOME_HEALTH_URL || vars.HOME_HEALTH_URL }}
      HOME_INJECT_URL: ${{ secrets.HOME_INJECT_URL || vars.HOME_INJECT_URL }}
      USER_MAP: ${{ secrets.USER_MAP || vars.USER_MAP }}
      CLOUDMAIL_ADMIN_EMAIL: ${{ secrets.CLOUDMAIL_ADMIN_EMAIL }}
      SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
      CLOUDMAIL_ADMIN_PASSWORD: ${{ secrets.CLOUDMAIL_ADMIN_PASSWORD }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install dependencies
        working-directory: ./sync-worker
        run: npm install

      - name: 📡 Disable wrangler telemetry
        working-directory: ./sync-worker
        run: npx wrangler telemetry disable

      - name: 🔍 Check required settings
        working-directory: ./sync-worker
        run: |
          fail=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDMAIL_URL HOME_HEALTH_URL HOME_INJECT_URL USER_MAP CLOUDMAIL_ADMIN_EMAIL CLOUDMAIL_ADMIN_PASSWORD SYNC_TOKEN SERVICE_TOKEN; do
            if [ -z "${!v}" ]; then echo "❌ $v is not set (add it as a repo secret or variable)."; fail=1; fi
          done
          if ! jq -e . >/dev/null 2>&1 <<< "$USER_MAP"; then echo "❌ USER_MAP is not valid JSON (e.g. {\"1\": \"support@bearermail.com\", \"2\": \"jett@bearermail.com\"})."; fail=1; fi
          if [ "$fail" = 1 ]; then exit 1; fi
          echo "✅ All required settings are present."

      - name: 🗄️ Set up SYNC_KV namespace
        working-directory: ./sync-worker
        run: |
          if [ -n "$SYNC_KV_ID" ]; then
            echo "✅ Using the SYNC_KV namespace from SYNC_KV_ID."
            exit 0
          fi

          echo "🔍 Checking if the SYNC_KV namespace exists..."

          set +e
            KV_LIST=$(npx wrangler kv namespace list 2>&1)
            STATUS=$?
          set -e

          if [ $STATUS -ne 0 ]; then
            echo "$KV_LIST"
            exit 1
          fi

          if echo "$KV_LIST" | jq -e '.[] | select(.title == "SYNC_KV")' >/dev/null; then
            echo "✅ Namespace SYNC_KV already exists."
            KV_ID=$(echo "$KV_LIST" | jq -r '.[] | select(.title == "SYNC_KV") | .id')
          else
            echo "⚠️ Namespace SYNC_KV does not exist. Starting creation..."
            npx wrangler kv namespace create SYNC_KV
            KV_LIST=$(npx wrangler kv namespace list)
            KV_ID=$(echo "$KV_LIST" | jq -r '.[] | select(.title == "SYNC_KV") | .id')
          fi

          echo "SYNC_KV_ID=$KV_ID" >> $GITHUB_ENV
          echo "✅ Namespace setup completed."

      - name: 🛠️ Build deploy config
        working-directory: ./sync-worker
        run: |
          # wrangler.toml is the template: the KV id and the [vars] are
          # empty there and get filled in here from repo secrets/variables,
          # so no id or URL is ever committed.
          cp wrangler.toml wrangler-deploy.toml
          python3 - <<'EOF'
          import json, os, re
          p = 'wrangler-deploy.toml'
          t = open(p).read()
          t = re.sub(r'(?m)^(id = )""', r'\g<1>"' + os.environ['SYNC_KV_ID'] + '"', t, count=1)
          for k in ['CLOUDMAIL_URL', 'HOME_HEALTH_URL', 'HOME_INJECT_URL', 'USER_MAP']:
              t = re.sub(r'(?m)^' + k + r' = ""', k + ' = ' + json.dumps(os.environ[k]), t, count=1)
          open(p, 'w').write(t)
          EOF
          # Fail loudly if any value stayed empty instead of deploying blind.
          if grep -Eq '^(id|CLOUDMAIL_URL|HOME_HEALTH_URL|HOME_INJECT_URL|USER_MAP) = ""' wrangler-deploy.toml; then
            echo "❌ A value in wrangler-deploy.toml is still empty."
            exit 1
          fi
          echo "✅ Deploy config ready."

      - name: 🚀 Deploy
        working-directory: ./sync-worker
        run: npx wrangler deploy -c wrangler-deploy.toml

      - name: 🔐 Set worker secrets
        working-directory: ./sync-worker
        run: |
          printf '%s' "$CLOUDMAIL_ADMIN_EMAIL" | npx wrangler secret put CLOUDMAIL_ADMIN_EMAIL
          printf '%s' "$CLOUDMAIL_ADMIN_PASSWORD" | npx wrangler secret put CLOUDMAIL_ADMIN_PASSWORD
          printf '%s' "$SYNC_TOKEN" | npx wrangler secret put SYNC_TOKEN
          printf '%s' "$SERVICE_TOKEN" | npx wrangler secret put SERVICE_TOKEN
          echo "✅ Secrets set. Test with: curl https://cloud-mail-sync.<your-subdomain>.workers.dev/sync"
